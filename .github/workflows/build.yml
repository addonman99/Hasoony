name: Hasoony Windows Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish executable
        run: >
          dotnet publish Hasoony.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: Hasoony-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/Hasoony.exe
          if-no-files-found: error
